# Builds the Android app (android/) and publishes it on the site as /shifokor.apk.
# Signing: with the repository secrets ANDROID_KEYSTORE_B64 (a base64 .jks with alias "shifokor") and
# ANDROID_KEY_PASSWORD the app keeps one key, so new versions install over old ones. Without them each build makes
# its own key (install the new APK after removing the old app). Either way the key's fingerprint is added to
# site/.well-known/assetlinks.json, which lets Android open shifokor.com full screen in the app.
name: Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: android
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > android/shifokor.jks
            echo "KEY_PW=$KS_PW" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore android/shifokor.jks -alias shifokor -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Shifokor, O=Shifokor, C=UZ"
            echo "KEY_PW=$PW" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish on the site
        run: |
          FP=$(keytool -list -v -keystore android/shifokor.jks -alias shifokor -storepass "$KEY_PW" | sed -n 's/.*SHA256: //p' | head -1)
          cp android/app/build/outputs/apk/release/app-release.apk site/shifokor.apk
          python3 - "$FP" <<'PY'
          import json, sys
          fp, path = sys.argv[1].strip(), "site/.well-known/assetlinks.json"
          try: links = json.load(open(path))
          except Exception: links = []
          entry = next((x for x in links if x.get("target", {}).get("package_name") == "uz.shifokor.app"), None)
          if not entry:
              entry = {"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "uz.shifokor.app", "sha256_cert_fingerprints": []}}
              links.append(entry)
          fps = entry["target"]["sha256_cert_fingerprints"]
          if fp and fp not in fps: fps.append(fp)
          entry["target"]["sha256_cert_fingerprints"] = fps[-5:]   # this build's key and the last few, so recent installs stay full screen
          json.dump(links, open(path, "w"), indent=2)
          PY
          git config user.name "Shifokor build"
          git config user.email "actions@users.noreply.github.com"
          git add site/shifokor.apk site/.well-known/assetlinks.json
          git commit -m "Android app build ${GITHUB_RUN_NUMBER}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
