<!doctype html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shifokor</title>
<script>
  /* the panel used to live at /panel/; it is now part of shifokor.com under #/account */
  (function () {
    var h = location.hash.replace(/^#/, "") || "/", p = h.split("?")[0], q = h.indexOf("?") > -1 ? h.slice(h.indexOf("?")) : "";
    var keep = /^\/(login|register|admin|consult\/|claim\/)/.test(p);
    location.replace("/#" + (keep ? p : "/account" + (p === "/" ? "" : p)) + q);
  })();
</script>
</head>
<body><p><a href="/">shifokor.com</a></p></body>
</html>
